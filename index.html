<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<title>วงล้อสุ่มรางวัล</title>
<style>
    body { 
        font-family: sans-serif; 
        text-align: center; 
        padding-top: 40px;
    }

    /* ทำให้ canvas responsive สำหรับมือถือ */
    #wheel{
        width: 90vw;
        height: 90vw;
        max-width: 450px;
        max-height: 450px;
        margin-top: 20px;
    }

    button{
        padding: 15px 30px;
        background:#ff6666;
        color:#fff;
        border:none;
        font-size:20px;
        border-radius:10px;
        cursor:pointer;
        margin-top:40px;
    }
</style>
</head>
<body>

<h1>สุ่มของขวัญ</h1>

<!-- ลูกศร -->
<div style="width:0px; margin:auto; position:relative; top:25px;">
    <div style="
        width: 0; 
        height: 0; 
        border-left: 20px solid transparent;
        border-right: 20px solid transparent;
        border-bottom: 35px solid red;
        position:absolute;
        left:-20px;
    "></div>
</div>

<canvas id="wheel" width="450" height="450"></canvas>

<button onclick="spin()">สุ่มเลย!</button>

<h2 id="result"></h2>

<script>
const canvas = document.getElementById("wheel");
const ctx = canvas.getContext("2d");

// รายการรางวัล
const prizes = ["50", "100", "500", "1000","ของขวัญปริศนา"];  
// สีแต่ละช่อง
const colors = ["#ff9999","#99ff99","#9999ff","#ffff99","#ffcccc"]; 

const wheelRadius = 200; 
const centerX = canvas.width / 2;
const centerY = canvas.height / 2;

function drawWheel(){
    const arc = 2 * Math.PI / prizes.length;

    for(let i = 0; i < prizes.length; i++){
        const startAngle = i * arc;
        
        // วาดช่อง
        ctx.beginPath();
        ctx.fillStyle = colors[i];
        ctx.moveTo(centerX, centerY);
        ctx.arc(centerX, centerY, wheelRadius, startAngle, startAngle + arc);
        ctx.fill();
        ctx.closePath();

        // วาดข้อความ (ให้อยู่กลางช่อง)
        ctx.save();
        ctx.translate(centerX, centerY);
        ctx.rotate(startAngle + arc/2);
        ctx.textAlign = "center";
        ctx.fillStyle = "#000";
        ctx.font = "bold 20px sans-serif";
        ctx.fillText(prizes[i], wheelRadius * 0.6, 8);
        ctx.restore();
    }

    // วาดกรอบ
    ctx.beginPath();
    ctx.arc(centerX, centerY, wheelRadius, 0, 2*Math.PI);
    ctx.lineWidth = 15;
    ctx.strokeStyle = "#333";
    ctx.stroke();
}

// วาดทันที
drawWheel();

// ฟังก์ชั่นหมุนวงล้อ
function spin(){

    // ----- ล็อครางวัลที่ "ของขวัญปริศนา" -----
    const targetPrize = "ของขวัญปริศนา"; 
    const index = prizes.indexOf(targetPrize);
    const arc = 2 * Math.PI / prizes.length;

    // หมุนหลายรอบก่อนหยุด
    const extraRotations = 6 * Math.PI; 
    const rotateTo = extraRotations + (index * arc) + arc/2;

    canvas.style.transition = "transform 6s ease-out"; 
    canvas.style.transform = `rotate(${rotateTo}rad)`;

    document.getElementById("result").innerHTML = "";
    
    setTimeout(()=>{
        document.getElementById("result").innerHTML = 
            `🎉 คุณได้รางวัล: <b>${targetPrize}</b>`;
    }, 6200);
}
</script>

</body>
</html>
