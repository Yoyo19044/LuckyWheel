<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<title>วงล้อสุ่มรางวัล</title>
<style>
    body { font-family: sans-serif; text-align: center; padding-top: 30px; }

    canvas { margin-top: 20px; }

    button{
        padding: 15px 30px;
        background:#ff6666;
        color:#fff;
        border:none;
        font-size:20px;
        border-radius:10px;
        cursor:pointer;
        margin-top:30px;
    }

    h1{margin:0;}

    /* ลูกศร */
    #pointer {
        width: 0;
        height: 0;
        border-left: 25px solid transparent;
        border-right: 25px solid transparent;
        border-top: 40px solid #ff3333; /* สีลูกศร */
        margin: auto;
        margin-top: -10px;
    }
</style>
</head>
<body>

<h1>สุ่มของขวัญ</h1>

<div id="pointer"></div>

<canvas id="wheel" width="400" height="400"></canvas>

<button onclick="spin()">สุ่มเลย!</button>

<h2 id="result"></h2>

<script>
const canvas = document.getElementById("wheel");
const ctx = canvas.getContext("2d");

const prizes = ["50", "100", "500", "1000","ของขวัญปริศนา"];  // รางวัล
const colors = ["#ff9999","#99ff99","#9999ff","#ffff99","#ffd1dc"]; // สีแต่ละช่อง

const wheelRadius = 180;
const centerX = canvas.width / 2;
const centerY = canvas.height / 2;

function drawWheel(){
    const arc = 2 * Math.PI / prizes.length;

    for(let i = 0; i < prizes.length; i++){
        const startAngle = i * arc;
        
        // วาดพื้นหลังของช่อง
        ctx.beginPath();
        ctx.fillStyle = colors[i];
        ctx.moveTo(centerX, centerY);
        ctx.arc(centerX, centerY, wheelRadius, startAngle, startAngle + arc);
        ctx.fill();
        ctx.closePath();

        // วาดข้อความ
        ctx.save();
        ctx.translate(centerX, centerY);
        ctx.rotate(startAngle + arc/2);
        ctx.textAlign = "right";
        ctx.fillStyle = "#000";
        ctx.font = "bold 18px sans-serif";
        ctx.fillText(prizes[i], wheelRadius - 10, 10);
        ctx.restore();
    }

    // วาดกรอบ
    ctx.beginPath();
    ctx.arc(centerX, centerY, wheelRadius, 0, 2*Math.PI);
    ctx.lineWidth = 12;
    ctx.strokeStyle = "#333";
    ctx.stroke();
}

// วาดครั้งแรก
drawWheel();

// ฟังก์ชั่นหมุนวงล้อ
function spin(){

    // ล็อครางวัลแบบเนียนๆ
    const targetPrize = "ของขวัญปริศนา";
    const index = prizes.indexOf(targetPrize);
    const arc = 2 * Math.PI / prizes.length;

    // หน่วงหมุน: หมุนหลายรอบแล้วค่อยหยุด
    const extraRotations = 10 * Math.PI; // รอบเยอะขึ้น = หน่วงเยอะขึ้น
    const rotateTo = extraRotations + (index * arc) + arc/2;

    canvas.style.transition = "transform 7s ease-out"; // ระยะเวลา 7 วิ
    canvas.style.transform = `rotate(${rotateTo}rad)`;

    document.getElementById("result").innerHTML = "";

    setTimeout(()=>{
        document.getElementById("result").innerHTML =
            `🎉 คุณได้รางวัล: <b>${targetPrize}</b>`;
    }, 7200);
}
</script>

</body>
</html>
